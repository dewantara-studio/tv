          package id.ringan.launcher

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.ColorFilter
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.graphics.RadialGradient
          import android.graphics.Rect
          import android.graphics.Shader
          import android.graphics.drawable.Drawable

          /**
           * Latar tenang tanpa gambar: gradasi gelap lembut ditambah beberapa "cahaya" besar yang kabur.
           * Digambar langsung dari shader, jadi tidak memakai memori bitmap dan tidak berat.
           */
          class SoftBackground(
              private val base: IntArray,
              private val glows: Array<Glow>
          ) : Drawable() {

              /** Posisi (cx, cy) dan radius dinyatakan sebagai pecahan dari lebar/tinggi layar. */
              class Glow(val cx: Float, val cy: Float, val radius: Float, val color: Int)

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var baseShader: Shader? = null
              private var glowShaders: List<Shader> = emptyList()

              override fun onBoundsChange(bounds: Rect) {
                  val w = bounds.width().toFloat()
                  val h = bounds.height().toFloat()
                  baseShader = LinearGradient(0f, 0f, w * 0.5f, h, base, null, Shader.TileMode.CLAMP)
                  glowShaders = glows.map {
                      RadialGradient(
                          w * it.cx,
                          h * it.cy,
                          w * it.radius,
                          it.color,
                          it.color and 0x00FFFFFF,
                          Shader.TileMode.CLAMP
                      )
                  }
              }

              override fun draw(canvas: Canvas) {
                  val area = bounds
                  paint.shader = baseShader
                  canvas.drawRect(area, paint)
                  for (shader in glowShaders) {
                      paint.shader = shader
                      canvas.drawRect(area, paint)
                  }
              }

              override fun setAlpha(alpha: Int) {
              }

              override fun setColorFilter(colorFilter: ColorFilter?) {
              }

              @Suppress("OVERRIDE_DEPRECATION")
              override fun getOpacity(): Int = PixelFormat.OPAQUE

              companion object {
                  private fun c(hex: String): Int = Color.parseColor(hex)

                  /** Biru malam dengan cahaya teal dan ungu lembut. */
                  fun aurora(): SoftBackground = SoftBackground(
                      intArrayOf(c("#0E1424"), c("#13263B"), c("#0F1A2A")),
                      arrayOf(
                          Glow(0.85f, 0.10f, 0.65f, c("#4022C7D6")),
                          Glow(0.10f, 0.95f, 0.75f, c("#407A5CFF"))
                      )
                  )

                  /** Biru laut dalam dengan cahaya cyan. */
                  fun ocean(): SoftBackground = SoftBackground(
                      intArrayOf(c("#0A1A24"), c("#0F2F3F"), c("#0B1F2C")),
                      arrayOf(
                          Glow(0.20f, 0.15f, 0.65f, c("#3840C4D8")),
                          Glow(0.90f, 0.95f, 0.70f, c("#382B6CFF"))
                      )
                  )

                  /** Hijau gelap berkabut dengan sentuhan hangat. */
                  fun forest(): SoftBackground = SoftBackground(
                      intArrayOf(c("#0B1713"), c("#12261F"), c("#0D1C17")),
                      arrayOf(
                          Glow(0.80f, 0.15f, 0.65f, c("#3544C79A")),
                          Glow(0.10f, 0.90f, 0.70f, c("#25C9B27A"))
                      )
                  )

                  /** Ungu senja dengan cahaya pink dan indigo. */
                  fun dusk(): SoftBackground = SoftBackground(
                      intArrayOf(c("#17122B"), c("#2A1B3F"), c("#1B1530")),
                      arrayOf(
                          Glow(0.85f, 0.20f, 0.65f, c("#44FF8FB1")),
                          Glow(0.15f, 0.85f, 0.75f, c("#447A6BFF"))
                      )
                  )
              }
          }
