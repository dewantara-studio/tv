          package id.ringan.launcher

          import android.content.Context
          import android.graphics.Color

          /**
           * Semua pengaturan launcher. Nilai pilihan disimpan sebagai nomor urut (indeks)
           * yang sesuai dengan daftar nama di companion object.
           */
          class Prefs(ctx: Context) {

              private val lookSp = ctx.getSharedPreferences("look", Context.MODE_PRIVATE)
              private val appsSp = ctx.getSharedPreferences("apps", Context.MODE_PRIVATE)

              private fun read(key: String, def: Int, count: Int): Int =
                  lookSp.getInt(key, def).coerceIn(0, count - 1)

              private fun write(key: String, value: Int) {
                  lookSp.edit().putInt(key, value).apply()
              }

              var accent: Int
                  get() = read("accent", 0, ACCENT_NAMES.size)
                  set(v) = write("accent", v)

              var background: Int
                  get() = read("bg", 2, BG_NAMES.size)
                  set(v) = write("bg", v)

              var cardStyle: Int
                  get() = read("card", 1, CARD_NAMES.size)
                  set(v) = write("card", v)

              var radius: Int
                  get() = read("radius", 1, RADIUS_NAMES.size)
                  set(v) = write("radius", v)

              var iconSize: Int
                  get() = read("icon", 1, ICON_NAMES.size)
                  set(v) = write("icon", v)

              var columns: Int
                  get() = read("cols", 0, COLUMN_NAMES.size)
                  set(v) = write("cols", v)

              var showLabel: Int
                  get() = read("label", 1, 2)
                  set(v) = write("label", v)

              var showClock: Int
                  get() = read("clock", 1, 2)
                  set(v) = write("clock", v)

              var clockFormat: Int
                  get() = read("clockfmt", 0, 2)
                  set(v) = write("clockfmt", v)

              var showDate: Int
                  get() = read("date", 1, 2)
                  set(v) = write("date", v)

              var showRam: Int
                  get() = read("ram", 1, 2)
                  set(v) = write("ram", v)

              var animate: Int
                  get() = read("anim", 1, 2)
                  set(v) = write("anim", v)

              var dim: Int
                  get() = read("dim", 2, DIM_NAMES.size)
                  set(v) = write("dim", v)

              /** Tandai foto latar berganti supaya launcher menggambar ulang. */
              fun touchWallpaper() {
                  lookSp.edit().putLong("wpver", System.currentTimeMillis()).apply()
              }

              fun resetLook() {
                  lookSp.edit().clear().apply()
              }

              // ---- Pengaturan aplikasi: 0 = tampil, 1 = tampil di atas (favorit), 2 = disembunyikan ----

              private fun stringSet(key: String): HashSet<String> {
                  val s = appsSp.getStringSet(key, null)
                  return if (s == null) HashSet() else HashSet(s)
              }

              fun appState(pkg: String): Int {
                  if (stringSet("pinned").contains(pkg)) return 1
                  if (stringSet("hidden").contains(pkg)) return 2
                  return 0
              }

              fun setAppState(pkg: String, state: Int) {
                  val hidden = stringSet("hidden")
                  val pinned = stringSet("pinned")
                  hidden.remove(pkg)
                  pinned.remove(pkg)
                  if (state == 1) pinned.add(pkg)
                  if (state == 2) hidden.add(pkg)
                  appsSp.edit().putStringSet("hidden", hidden).putStringSet("pinned", pinned).apply()
              }

              fun showAll() {
                  appsSp.edit().putStringSet("hidden", HashSet<String>()).apply()
              }

              fun hideAll(pkgs: List<String>) {
                  appsSp.edit()
                      .putStringSet("hidden", HashSet<String>(pkgs))
                      .putStringSet("pinned", HashSet<String>())
                      .apply()
              }

              /** Aplikasi yang tampil di launcher: favorit di atas, sisanya urut abjad. */
              fun visible(all: List<AppEntry>): List<AppEntry> {
                  val hidden = stringSet("hidden")
                  val pinned = stringSet("pinned")
                  val shown = all.filter { !hidden.contains(it.pkg) }
                  return shown.filter { pinned.contains(it.pkg) } + shown.filter { !pinned.contains(it.pkg) }
              }

              /** Berubah setiap kali ada pengaturan yang diubah; dipakai untuk tahu kapan layar perlu digambar ulang. */
              fun signature(): String = lookSp.all.toString() + appsSp.all.toString()

              companion object {
                  val ACCENT_NAMES = arrayOf("Biru", "Hijau", "Oranye", "Ungu", "Merah", "Cyan", "Pink")
                  val ACCENTS = intArrayOf(
                      Color.parseColor("#3D7BFF"),
                      Color.parseColor("#2ECC71"),
                      Color.parseColor("#FF8A3D"),
                      Color.parseColor("#9B6BFF"),
                      Color.parseColor("#FF4D5E"),
                      Color.parseColor("#22C7D6"),
                      Color.parseColor("#FF5FA2")
                  )
                  val BG_NAMES = arrayOf(
                      "Gelap", "Hitam pekat", "Aurora tenang", "Laut tenang",
                      "Hutan berkabut", "Lavender senja", "Terang", "Foto sendiri"
                  )
                  val DIM_NAMES = arrayOf("Tanpa", "25%", "50%", "75%")
                  val CARD_NAMES = arrayOf("Solid", "Kaca (transparan)", "Tanpa kartu")
                  val RADIUS_NAMES = arrayOf("Tajam", "Sedang", "Bulat")
                  val ICON_NAMES = arrayOf("Kecil", "Sedang", "Besar")
                  val COLUMN_NAMES = arrayOf("Otomatis", "4", "5", "6", "7", "8")
                  val COLUMN_VALUES = intArrayOf(0, 4, 5, 6, 7, 8)
                  val SHOW_NAMES = arrayOf("Sembunyi", "Tampil")
                  val ON_NAMES = arrayOf("Mati", "Hidup")
                  val CLOCK_NAMES = arrayOf("24 jam", "12 jam")
              }
          }
