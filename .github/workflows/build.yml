                              LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                          )

                          val state = TextView(this@ManageAppsActivity)
                          state.textSize = 16f
                          container.addView(
                              state,
                              LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                              )
                          )

                          holder = Holder(icon, name, state)
                          container.tag = holder
                          view = container
                      } else {
                          view = convertView
                          holder = convertView.tag as Holder
                      }

                      val item = items[position]
                      val app = item.app
                      if (app == null) {
                          holder.icon.visibility = View.GONE
                          holder.name.text =
                              if (item.action == 1) "Tampilkan semua aplikasi" else "Sembunyikan semua aplikasi"
                          holder.name.setTextColor(look.accent)
                          holder.state.text = ""
                      } else {
                          val state = prefs.appState(app.pkg)
                          holder.icon.visibility = View.VISIBLE
                          holder.icon.setImageDrawable(IconCache.get(this@ManageAppsActivity, app))
                          holder.name.text = app.label
                          holder.name.setTextColor(
                              if (state == 2) look.textSecondary else look.textPrimary
                          )
                          when (state) {
                              1 -> {
                                  holder.state.text = "★ Di atas"
                                  holder.state.setTextColor(look.accent)
                              }
                              2 -> {
                                  holder.state.text = "Disembunyikan"
                                  holder.state.setTextColor(look.textSecondary)
                              }
                              else -> {
                                  holder.state.text = "Tampil"
                                  holder.state.setTextColor(look.textPrimary)
                              }
                          }
                      }
                      return view
                  }
              }
          }
