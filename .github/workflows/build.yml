          package id.ringan.launcher

          import android.Manifest
          import android.content.ContentUris
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.TextView
          import android.widget.Toast
          import java.io.File
          import java.io.FileOutputStream

          /**
           * Pilih foto dari penyimpanan TV sebagai latar. Foto dipotong 16:9 dan diperkecil
           * ke 1280x720 lalu disimpan di dalam aplikasi, jadi tetap ringan dan tidak butuh izin lagi.
           */
          class WallpaperActivity : ListPage() {

              private class Photo(val id: Long, val name: String)

              override val pageTitle: String
                  get() = "Pilih Foto Latar"

              override val pageHint: String
                  get() = "Foto harus ada di penyimpanan TV (misalnya folder Download), rasio 16:9 paling bagus     Back: batal"

              private var photos: List<Photo> = emptyList()
              private var busy = false
              private val adapter = PhotoAdapter()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  listView.adapter = adapter
                  listView.setOnItemClickListener { _, _, position, _ ->
                      if (position < photos.size && !busy) useAsWallpaper(photos[position])
                  }
                  listView.requestFocus()

                  if (hasPermission()) {
                      loadPhotos()
                  } else {
                      requestPermissions(arrayOf(permissionName()), 1)
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      loadPhotos()
                  } else {
                      Toast.makeText(this, "Izin membaca foto ditolak", Toast.LENGTH_LONG).show()
                  }
              }

              private fun permissionName(): String =
                  if (Build.VERSION.SDK_INT >= 33) {
                      Manifest.permission.READ_MEDIA_IMAGES
                  } else {
                      Manifest.permission.READ_EXTERNAL_STORAGE
                  }

              private fun hasPermission(): Boolean =
                  Build.VERSION.SDK_INT < 23 ||
                      checkSelfPermission(permissionName()) == PackageManager.PERMISSION_GRANTED

              private fun loadPhotos() {
                  val result = ArrayList<Photo>()
                  val cursor = contentResolver.query(
                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                      arrayOf(MediaStore.Images.Media._ID, MediaStore.Images.Media.DISPLAY_NAME),
                      null,
                      null,
                      MediaStore.Images.Media.DATE_ADDED + " DESC"
                  )
                  if (cursor != null) {
                      cursor.use {
                          while (it.moveToNext() && result.size < 300) {
                              result.add(Photo(it.getLong(0), it.getString(1) ?: "foto"))
                          }
                      }
                  }
                  photos = result
                  adapter.notifyDataSetChanged()
              }

              private fun useAsWallpaper(photo: Photo) {
                  busy = true
                  Toast.makeText(this, "Memproses foto...", Toast.LENGTH_SHORT).show()
                  Thread {
                      val ok = saveWallpaper(photo.id)
                      runOnUiThread {
                          busy = false
                          if (ok) {
                              prefs.background = 7
                              prefs.touchWallpaper()
                              Toast.makeText(this, "Foto latar dipasang", Toast.LENGTH_SHORT).show()
                              finish()
                          } else {
                              Toast.makeText(this, "Foto tidak bisa dipakai", Toast.LENGTH_LONG).show()
                          }
                      }
                  }.start()
              }

              private fun saveWallpaper(id: Long): Boolean {
                  return try {
                      val uri = ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id)

                      val bounds = BitmapFactory.Options()
                      bounds.inJustDecodeBounds = true
                      contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                      if (bounds.outWidth <= 0 || bounds.outHeight <= 0) return false

                      var sample = 1
                      while (bounds.outWidth / (sample * 2) >= TARGET_W && bounds.outHeight / (sample * 2) >= TARGET_H) {
                          sample *= 2
                      }
                      val options = BitmapFactory.Options()
                      options.inSampleSize = sample
                      options.inPreferredConfig = Bitmap.Config.RGB_565
                      val source = contentResolver.openInputStream(uri)?.use {
                          BitmapFactory.decodeStream(it, null, options)
                      } ?: return false

                      // Potong bagian tengah menjadi 16:9
                      val w = source.width
                      val h = source.height
                      val cropW: Int
                      val cropH: Int
                      if (w.toFloat() / h > 16f / 9f) {
                          cropH = h
                          cropW = (h * 16f / 9f).toInt()
                      } else {
                          cropW = w
                          cropH = (w * 9f / 16f).toInt()
                      }
                      val cropped = Bitmap.createBitmap(source, (w - cropW) / 2, (h - cropH) / 2, cropW, cropH)
                      val scaled = Bitmap.createScaledBitmap(cropped, TARGET_W, TARGET_H, true)

                      FileOutputStream(File(filesDir, "wallpaper.jpg")).use {
                          scaled.compress(Bitmap.CompressFormat.JPEG, 90, it)
                      }
                      true
                  } catch (e: Throwable) {
                      false
                  }
              }

              private inner class PhotoAdapter : BaseAdapter() {
                  override fun getCount(): Int = if (photos.isEmpty()) 1 else photos.size

                  override fun getItem(position: Int): Any = position

                  override fun getItemId(position: Int): Long = position.toLong()

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                      val view: TextView = if (convertView is TextView) {
                          convertView
                      } else {
                          val t = TextView(this@WallpaperActivity)
                          t.textSize = 20f
                          t.setPadding(look.dp(24), look.dp(14), look.dp(24), look.dp(14))
                          t.maxLines = 1
                          t
                      }
                      if (photos.isEmpty()) {
                          view.text = "Tidak ada foto di penyimpanan TV. Salin foto ke folder Download lalu buka layar ini lagi."
                          view.setTextColor(look.textSecondary)
                      } else {
                          view.text = photos[position].name
                          view.setTextColor(look.textPrimary)
                      }
                      return view
                  }
              }

              companion object {
                  private const val TARGET_W = 1280
                  private const val TARGET_H = 720
              }
          }
          EOF_RINGAN
