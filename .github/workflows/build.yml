name: Build Ringan Launcher

# Satu file ini sudah berisi seluruh source project.
# Setiap push ke branch main (atau tombol Run workflow) akan membangun APK
# dan menerbitkannya di halaman Releases repo ini.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Tulis source project
        run: |
          mkdir -p app app/src/main app/src/main/java/id/ringan/launcher app/src/main/res/drawable app/src/main/res/layout app/src/main/res/values
          cat > app/build.gradle.kts <<'EOF_RINGAN'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "id.ringan.launcher"
              compileSdk = 34

              defaultConfig {
                  applicationId = "id.ringan.launcher"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))
                      // Ditandatangani dengan kunci debug supaya APK release langsung bisa dipasang
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              implementation("androidx.recyclerview:recyclerview:1.3.2")
          }
          EOF_RINGAN
          cat > app/src/main/AndroidManifest.xml <<'EOF_RINGAN'
          <?xml version="1.0" encoding="utf-8"?>
