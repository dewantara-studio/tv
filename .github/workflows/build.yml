          package id.ringan.launcher

          import android.content.Intent
          import android.os.Bundle
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.LinearLayout
          import android.widget.TextView

          /** Layar "Atur Tampilan": setiap baris punya beberapa pilihan yang diputar dengan OK atau kiri/kanan. */
          class SettingsActivity : ListPage() {

              private class Row(
                  val title: String,
                  val choices: Array<String>?,
                  val read: () -> Int,
                  val write: (Int) -> Unit,
                  val action: (() -> Unit)?
              )

              private class Holder(val title: TextView, val value: TextView)

              override val pageTitle: String
                  get() = "Atur Tampilan"

              override val pageHint: String
                  get() = "OK atau tombol kiri/kanan: ganti pilihan     Back: kembali"

              private var rows: List<Row> = emptyList()
              private val adapter = RowAdapter()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val p = prefs
                  rows = listOf(
                      Row("Aplikasi yang ditampilkan", null, { 0 }, { }, {
                          startActivity(Intent(this, ManageAppsActivity::class.java))
                      }),
                      Row("Warna aksen", Prefs.ACCENT_NAMES, { p.accent }, { p.accent = it }, null),
                      Row("Latar belakang", Prefs.BG_NAMES, { p.background }, { p.background = it }, null),
                      Row("Pilih foto latar", null, { 0 }, { }, {
                          startActivity(Intent(this, WallpaperActivity::class.java))
                      }),
                      Row("Redupkan foto latar", Prefs.DIM_NAMES, { p.dim }, { p.dim = it }, null),
                      Row("Gaya kartu", Prefs.CARD_NAMES, { p.cardStyle }, { p.cardStyle = it }, null),
                      Row("Sudut kartu", Prefs.RADIUS_NAMES, { p.radius }, { p.radius = it }, null),
                      Row("Ukuran ikon", Prefs.ICON_NAMES, { p.iconSize }, { p.iconSize = it }, null),
                      Row("Jumlah kolom", Prefs.COLUMN_NAMES, { p.columns }, { p.columns = it }, null),
                      Row("Nama aplikasi", Prefs.SHOW_NAMES, { p.showLabel }, { p.showLabel = it }, null),
                      Row("Jam", Prefs.SHOW_NAMES, { p.showClock }, { p.showClock = it }, null),
                      Row("Format jam", Prefs.CLOCK_NAMES, { p.clockFormat }, { p.clockFormat = it }, null),
                      Row("Tanggal", Prefs.SHOW_NAMES, { p.showDate }, { p.showDate = it }, null),
                      Row("Info RAM", Prefs.SHOW_NAMES, { p.showRam }, { p.showRam = it }, null),
                      Row("Animasi saat disorot (matikan jika terasa berat)", Prefs.ON_NAMES, { p.animate }, { p.animate = it }, null),
                      Row("Kembalikan tampilan ke awal", null, { 0 }, { }, {
                          p.resetLook()
                          afterChange()
                      })
                  )

                  listView.adapter = adapter
                  listView.setOnItemClickListener { _, _, position, _ ->
                      val row = rows[position]
                      val action = row.action
                      if (action != null) action() else step(row, 1)
                  }
                  listView.requestFocus()
              }

              // Kembali dari layar pilih foto atau pilih aplikasi: segarkan tampilan
              override fun onResume() {
                  super.onResume()
                  applyLook()
                  adapter.notifyDataSetChanged()
              }

              // Tombol kiri/kanan memutar pilihan pada baris yang sedang disorot
              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (event.action == KeyEvent.ACTION_DOWN &&
                      (event.keyCode == KeyEvent.KEYCODE_DPAD_LEFT || event.keyCode == KeyEvent.KEYCODE_DPAD_RIGHT)
                  ) {
                      val pos = listView.selectedItemPosition
                      if (pos >= 0 && pos < rows.size && rows[pos].choices != null) {
                          step(rows[pos], if (event.keyCode == KeyEvent.KEYCODE_DPAD_RIGHT) 1 else -1)
                          return true
                      }
                  }
                  return super.dispatchKeyEvent(event)
              }

              private fun step(row: Row, delta: Int) {
                  val choices = row.choices ?: return
                  val n = choices.size
                  row.write(((row.read() + delta) % n + n) % n)
                  afterChange()
              }

              private fun afterChange() {
                  applyLook()
                  adapter.notifyDataSetChanged()
              }

              private inner class RowAdapter : BaseAdapter() {
                  override fun getCount(): Int = rows.size

                  override fun getItem(position: Int): Any = rows[position]

                  override fun getItemId(position: Int): Long = position.toLong()

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                      val holder: Holder
                      val view: View
                      if (convertView == null) {
                          val container = LinearLayout(this@SettingsActivity)
                          container.orientation = LinearLayout.HORIZONTAL
                          container.gravity = Gravity.CENTER_VERTICAL
                          container.setPadding(look.dp(24), look.dp(14), look.dp(24), look.dp(14))

                          val title = TextView(this@SettingsActivity)
                          title.textSize = 20f
                          container.addView(
                              title,
                              LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                          )

                          val value = TextView(this@SettingsActivity)
                          value.textSize = 18f
                          container.addView(
                              value,
                              LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT
                              )
                          )

                          holder = Holder(title, value)
                          container.tag = holder
                          view = container
                      } else {
                          view = convertView
                          holder = convertView.tag as Holder
                      }

                      val row = rows[position]
                      holder.title.text = row.title
                      holder.title.setTextColor(look.textPrimary)
                      val choices = row.choices
                      holder.value.text = if (choices != null) {
                          "‹   " + choices[row.read()] + "   ›"
                      } else {
                          "›"
                      }
                      holder.value.setTextColor(look.accent)
                      return view
                  }
              }
          }
