          cat > app/src/main/java/id/ringan/launcher/Apps.kt <<'EOF_RINGAN'
          package id.ringan.launcher

          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.drawable.Drawable
          import android.util.LruCache

          class AppEntry(val label: String, val pkg: String, val intent: Intent)

          object AppLoader {
              /** Semua aplikasi yang bisa dibuka, urut abjad (kecuali launcher ini sendiri). */
              fun loadAll(ctx: Context): List<AppEntry> {
                  val pm = ctx.packageManager
                  val seen = HashSet<String>()
                  val result = ArrayList<AppEntry>()
                  // Kategori leanback didahulukan agar aplikasi TV memakai entri TV-nya
                  val categories = arrayOf(Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER)
                  for (category in categories) {
                      val query = Intent(Intent.ACTION_MAIN).addCategory(category)
                      for (info in pm.queryIntentActivities(query, 0)) {
                          val pkg = info.activityInfo.packageName
                          if (pkg == ctx.packageName || !seen.add(pkg)) continue
                          val launch = Intent(Intent.ACTION_MAIN)
                              .addCategory(category)
                              .setComponent(ComponentName(pkg, info.activityInfo.name))
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
                          result.add(AppEntry(info.loadLabel(pm).toString(), pkg, launch))
                      }
                  }
                  result.sortBy { it.label.lowercase() }
                  return result
              }
          }

          object IconCache {
              private val cache = LruCache<String, Drawable>(120)

              fun get(ctx: Context, app: AppEntry): Drawable? {
                  val cached = cache.get(app.pkg)
                  if (cached != null) {
                      return cached.constantState?.newDrawable() ?: cached
                  }
                  return try {
                      val icon = ctx.packageManager.getActivityIcon(app.intent)
                      cache.put(app.pkg, icon)
                      icon.constantState?.newDrawable() ?: icon
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          EOF_RINGAN
          cat > app/src/main/java/id/ringan/launcher/ListPage.kt <<'EOF_RINGAN'
          package id.ringan.launcher

          import android.app.Activity
          import android.graphics.Typeface
          import android.os.Bundle
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView

          /**
           * Kerangka layar pengaturan: judul, petunjuk, dan daftar yang bisa dipilih dengan D-pad.
           * Warna mengikuti tema yang sedang dipilih.
           */
          abstract class ListPage : Activity() {

              protected lateinit var prefs: Prefs
              protected lateinit var look: Look
              protected lateinit var listView: ListView

              private lateinit var root: LinearLayout
              private lateinit var titleView: TextView
              private lateinit var hintView: TextView

              protected abstract val pageTitle: String
              protected abstract val pageHint: String

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = Prefs(this)
                  look = Look(this, prefs)

                  root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(look.dp(56), look.dp(32), look.dp(56), look.dp(16))

                  titleView = TextView(this)
                  titleView.text = pageTitle
                  titleView.textSize = 28f
                  titleView.typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  root.addView(titleView)

                  hintView = TextView(this)
                  hintView.text = pageHint
                  hintView.textSize = 14f
                  hintView.setPadding(0, look.dp(4), 0, look.dp(12))
                  root.addView(hintView)

                  listView = ListView(this)
                  listView.divider = null
                  listView.dividerHeight = 0
                  listView.isVerticalScrollBarEnabled = false
                  root.addView(
                      listView,
                      LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f)
                  )

                  setContentView(root)
                  applyLook()
              }

              protected fun applyLook() {
                  look = Look(this, prefs)
                  root.background = look.background()
                  titleView.setTextColor(look.textPrimary)
                  hintView.setTextColor(look.textSecondary)
                  listView.selector = look.rowSelector()
              }
          }
          EOF_RINGAN
          cat > app/src/main/java/id/ringan/launcher/Look.kt <<'EOF_RINGAN'
          package id.ringan.launcher

          import android.content.Context
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.InsetDrawable
          import android.graphics.drawable.StateListDrawable
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.drawable.BitmapDrawable
          import android.graphics.drawable.LayerDrawable
          import java.io.File

          /**
           * Tema visual yang dihitung dari pengaturan: warna, ukuran, dan semua drawable.
           * Dibuat ulang setiap kali pengaturan berubah.
           */
          class Look(ctx: Context, p: Prefs) {

              private val appCtx: Context = ctx.applicationContext
              private val dimIndex: Int = p.dim
              private val density = ctx.resources.displayMetrics.density

              fun dp(v: Int): Int = (v * density + 0.5f).toInt()

              val accent: Int = Prefs.ACCENTS[p.accent]
              private val bgIndex: Int = p.background
              val light: Boolean = bgIndex == 6
              private val cardStyle: Int = p.cardStyle

              val textPrimary: Int = if (light) Color.parseColor("#1A1F26") else Color.WHITE
              val textSecondary: Int =
                  if (light) Color.parseColor("#5B6673") else Color.parseColor("#9AA6B5")

              val iconDp: Int = intArrayOf(48, 64, 84)[p.iconSize]
              val iconPx: Int = dp(iconDp)
              val labelSp: Float = floatArrayOf(12f, 14f, 16f)[p.iconSize]
              private val radiusPx: Float = dp(intArrayOf(6, 16, 28)[p.radius]).toFloat()

              private fun solid(hex: String): Drawable = ColorDrawable(Color.parseColor(hex))

              private fun gradient(from: String, to: String): Drawable =
                  GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(Color.parseColor(from), Color.parseColor(to))
                  )

              fun background(): Drawable = when (bgIndex) {
                  0 -> solid("#0F1217")
                  1 -> solid("#000000")
                  2 -> SoftBackground.aurora()
                  3 -> SoftBackground.ocean()
                  4 -> SoftBackground.forest()
                  5 -> SoftBackground.dusk()
                  6 -> solid("#EEF1F5")
                  else -> photo()
              }

              /** Foto latar pilihan sendiri (sudah dipotong 16:9), diredupkan agar teks tetap terbaca. */
              private fun photo(): Drawable {
                  val file = File(appCtx.filesDir, "wallpaper.jpg")
                  var bitmap: Bitmap? = null
                  if (file.exists()) {
                      val options = BitmapFactory.Options()
                      options.inPreferredConfig = Bitmap.Config.RGB_565
                      bitmap = BitmapFactory.decodeFile(file.path, options)
                  }
                  if (bitmap == null) return solid("#0F1217")
                  val alpha = intArrayOf(0, 64, 128, 191)[dimIndex]
                  val layers = arrayOf<Drawable>(
                      BitmapDrawable(appCtx.resources, bitmap),
                      ColorDrawable(Color.argb(alpha, 0, 0, 0))
                  )
                  return LayerDrawable(layers)
              }

              private fun focusedCard(): GradientDrawable {
                  val d = GradientDrawable()
                  d.setCornerRadius(radiusPx)
                  val alpha = if (light) 40 else 55
                  d.setColor(Color.argb(alpha, Color.red(accent), Color.green(accent), Color.blue(accent)))
                  d.setStroke(dp(3), accent)
                  return d
              }

              /** Latar kartu aplikasi: gaya sesuai pilihan, dan bingkai warna aksen saat difokus. */
              fun cardBackground(): Drawable {
                  val normal = GradientDrawable()
                  normal.setCornerRadius(radiusPx)
                  val fill = when (cardStyle) {
                      0 -> if (light) Color.WHITE else Color.parseColor("#1D232B")
                      1 -> if (light) Color.parseColor("#99FFFFFF") else Color.parseColor("#1AFFFFFF")
                      else -> Color.TRANSPARENT
                  }
                  normal.setColor(fill)

                  val states = StateListDrawable()
                  states.addState(intArrayOf(android.R.attr.state_focused), focusedCard())
                  states.addState(intArrayOf(), normal)
                  return states
              }

              /** Sorotan baris pada layar pengaturan (ListView). */
              fun rowSelector(): Drawable = InsetDrawable(focusedCard(), dp(2))

              /** Tombol bentuk pil di bagian atas. */
              fun pillBackground(): Drawable {
                  val normal = GradientDrawable()
                  normal.setCornerRadius(dp(22).toFloat())
                  normal.setColor(if (light) Color.parseColor("#14000000") else Color.parseColor("#1FFFFFFF"))

                  val focused = GradientDrawable()
                  focused.setCornerRadius(dp(22).toFloat())
                  focused.setColor(accent)

                  val states = StateListDrawable()
                  states.addState(intArrayOf(android.R.attr.state_focused), focused)
                  states.addState(intArrayOf(), normal)
                  return states
              }

              fun pillTextColors(): ColorStateList =
                  ColorStateList(
                      arrayOf(intArrayOf(android.R.attr.state_focused), intArrayOf()),
                      intArrayOf(Color.WHITE, textPrimary)
                  )
          }
          EOF_RINGAN
          cat > app/src/main/java/id/ringan/launcher/MainActivity.kt <<'EOF_RINGAN'
          package id.ringan.launcher

          import android.app.Activity
          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.KeyEvent
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.TextClock
          import android.widget.TextView
          import android.widget.Toast
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import kotlin.math.max

          /**
           * Layar utama launcher. Tampilan dan daftar aplikasi diatur lewat
           * tombol "Atur Launcher" (SettingsActivity dan ManageAppsActivity).
           */
          class MainActivity : Activity() {

              private lateinit var prefs: Prefs
              private lateinit var look: Look
              private lateinit var root: View
              private lateinit var clock: TextClock
              private lateinit var date: TextClock
              private lateinit var ramText: TextView
              private lateinit var hint: TextView
              private lateinit var emptyText: TextView
              private lateinit var btnClean: TextView
              private lateinit var btnLauncher: TextView
              private lateinit var btnSettings: TextView
              private lateinit var list: RecyclerView

              private var apps: List<AppEntry> = emptyList()
              private var lastSignature = ""

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  root = findViewById<View>(R.id.root)
                  clock = findViewById<TextClock>(R.id.clock)
                  date = findViewById<TextClock>(R.id.date)
                  ramText = findViewById<TextView>(R.id.ram)
                  hint = findViewById<TextView>(R.id.hint)
                  emptyText = findViewById<TextView>(R.id.empty)
                  btnClean = findViewById<TextView>(R.id.btn_clean)
                  btnLauncher = findViewById<TextView>(R.id.btn_launcher)
                  btnSettings = findViewById<TextView>(R.id.btn_settings)
                  list = findViewById<RecyclerView>(R.id.list)

                  btnClean.setOnClickListener { cleanRam() }
                  btnLauncher.setOnClickListener { openLauncherSettings() }
                  btnSettings.setOnClickListener { openSystemSettings() }
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
                  if (currentFocus == null) focusFirst()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  // Tombol Home ditekan saat launcher sudah terbuka: kembali ke awal
                  list.scrollToPosition(0)
                  focusFirst()
              }

              // Launcher tidak boleh tertutup oleh tombol Back
              @Suppress("OVERRIDE_DEPRECATION")
              override fun onBackPressed() {
              }

              // Tombol Menu: info aplikasi yang sedang disorot (hapus / nonaktifkan / paksa berhenti),
              // atau pengaturan launcher jika fokus tidak sedang di aplikasi.
              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (event.action == KeyEvent.ACTION_DOWN && event.keyCode == KeyEvent.KEYCODE_MENU) {
                      val focused = currentFocus
                      val holder = if (focused != null) list.findContainingViewHolder(focused) else null
                      val pos = holder?.bindingAdapterPosition ?: RecyclerView.NO_POSITION
                      if (pos != RecyclerView.NO_POSITION && pos < apps.size) {
                          showAppInfo(apps[pos])
                      } else {
                          openLauncherSettings()
                      }
                      return true
                  }
                  return super.dispatchKeyEvent(event)
              }

              private fun refresh() {
                  prefs = Prefs(this)
                  val shown = prefs.visible(AppLoader.loadAll(this))
                  val signature = prefs.signature() + "|" + shown.joinToString(",") { it.pkg }
                  if (signature != lastSignature) {
                      lastSignature = signature
                      look = Look(this, prefs)
                      apps = shown
                      applyLook()
                      buildList()
                  }
                  updateRam()
              }

              private fun applyLook() {
                  root.background = look.background()

                  clock.setTextColor(look.textPrimary)
                  date.setTextColor(look.textSecondary)
                  ramText.setTextColor(look.textSecondary)
                  hint.setTextColor(look.textSecondary)
                  emptyText.setTextColor(look.textSecondary)

                  val timeFormat = if (prefs.clockFormat == 0) "HH:mm" else "h:mm a"
                  clock.format12Hour = timeFormat
                  clock.format24Hour = timeFormat
                  val dateFormat = "EEEE, d MMMM"
                  date.format12Hour = dateFormat
                  date.format24Hour = dateFormat

                  clock.visibility = if (prefs.showClock == 1) View.VISIBLE else View.GONE
                  date.visibility = if (prefs.showDate == 1) View.VISIBLE else View.GONE
                  ramText.visibility = if (prefs.showRam == 1) View.VISIBLE else View.GONE

                  val buttons = arrayOf(btnClean, btnLauncher, btnSettings)
                  for (button in buttons) {
                      button.background = look.pillBackground()
                      button.setTextColor(look.pillTextColors())
                  }
              }

              private fun buildList() {
                  val metrics = resources.displayMetrics
                  val widthDp = metrics.widthPixels / metrics.density
                  val chosen = Prefs.COLUMN_VALUES[prefs.columns]
                  val columns = if (chosen == 0) {
                      max(3, ((widthDp - 100f) / (look.iconDp + 52)).toInt())
                  } else {
                      chosen
                  }

                  list.layoutManager = GridLayoutManager(this, columns)
                  list.adapter = AppAdapter(
                      apps,
                      look,
                      prefs.animate == 1,
                      prefs.showLabel == 1,
                      { app -> launchApp(app) },
                      { app -> showAppInfo(app) }
                  )
                  emptyText.visibility = if (apps.isEmpty()) View.VISIBLE else View.GONE
                  focusFirst()
              }

              private fun focusFirst() {
                  list.post {
                      if (apps.isEmpty()) {
                          btnLauncher.requestFocus()
                      } else {
                          list.requestFocus()
                      }
                  }
              }

              private fun launchApp(app: AppEntry) {
                  try {
                      startActivity(app.intent)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Tidak bisa membuka " + app.label, Toast.LENGTH_SHORT).show()
                  }
              }

              private fun showAppInfo(app: AppEntry) {
                  try {
                      val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS)
                          .setData(Uri.parse("package:" + app.pkg))
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(intent)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Info aplikasi tidak tersedia", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun openLauncherSettings() {
                  startActivity(Intent(this, SettingsActivity::class.java))
              }

              private fun openSystemSettings() {
                  try {
                      startActivity(Intent(Settings.ACTION_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (e: Exception) {
                      Toast.makeText(this, "Pengaturan TV tidak tersedia", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun updateRam() {
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val info = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(info)
                  val free = info.availMem / 1048576L
                  val total = info.totalMem / 1048576L
                  ramText.text = "RAM bebas " + free + " / " + total + " MB"
              }

              private fun cleanRam() {
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  for (appInfo in packageManager.getInstalledApplications(0)) {
                      if (appInfo.packageName != packageName) {
                          am.killBackgroundProcesses(appInfo.packageName)
                      }
                  }
                  Toast.makeText(this, "RAM dibersihkan", Toast.LENGTH_SHORT).show()
                  list.postDelayed({ updateRam() }, 1000L)
              }
          }

          private class AppAdapter(
              private val apps: List<AppEntry>,
              private val look: Look,
              private val animate: Boolean,
              private val showLabel: Boolean,
              private val onClick: (AppEntry) -> Unit,
              private val onInfo: (AppEntry) -> Unit
          ) : RecyclerView.Adapter<AppAdapter.VH>() {

              class VH(view: View) : RecyclerView.ViewHolder(view) {
                  val icon: ImageView = view.findViewById<ImageView>(R.id.icon)
                  val label: TextView = view.findViewById<TextView>(R.id.label)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val view = LayoutInflater.from(parent.context).inflate(R.layout.item_app, parent, false)
                  view.background = look.cardBackground()

                  val holder = VH(view)

                  val iconParams = holder.icon.layoutParams
                  iconParams.width = look.iconPx
                  iconParams.height = look.iconPx
                  holder.icon.layoutParams = iconParams

                  holder.label.setTextColor(look.textPrimary)
                  holder.label.textSize = look.labelSp
                  holder.label.visibility = if (showLabel) View.VISIBLE else View.GONE

                  view.setOnClickListener {
                      val pos = holder.bindingAdapterPosition
                      if (pos != RecyclerView.NO_POSITION) onClick(apps[pos])
                  }
                  view.setOnLongClickListener {
                      val pos = holder.bindingAdapterPosition
                      if (pos != RecyclerView.NO_POSITION) onInfo(apps[pos])
                      true
                  }
                  if (animate) {
                      view.setOnFocusChangeListener { v, hasFocus ->
                          val scale = if (hasFocus) 1.08f else 1f
                          val lift = if (hasFocus) look.dp(8).toFloat() else 0f
                          v.animate().scaleX(scale).scaleY(scale).translationZ(lift).setDuration(120L).start()
                      }
                  }
                  return holder
              }

              override fun onBindViewHolder(holder: VH, position: Int) {
                  val app = apps[position]
                  holder.icon.setImageDrawable(IconCache.get(holder.itemView.context, app))
                  holder.label.text = app.label
              }

              override fun onViewRecycled(holder: VH) {
                  holder.itemView.animate().cancel()
                  holder.itemView.scaleX = 1f
                  holder.itemView.scaleY = 1f
                  holder.itemView.translationZ = 0f
              }

              override fun getItemCount(): Int = apps.size
          }
          EOF_RINGAN
          cat > app/src/main/java/id/ringan/launcher/ManageAppsActivity.kt <<'EOF_RINGAN'
          package id.ringan.launcher

          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView

          /**
           * Pilih aplikasi mana yang tampil di launcher.
           * OK pada sebuah aplikasi memutar: Tampil, Di atas (favorit), Disembunyikan.
           */
          class ManageAppsActivity : ListPage() {

              // app == null berarti baris aksi: action 1 = tampilkan semua, 2 = sembunyikan semua
              private class Item(val app: AppEntry?, val action: Int)

              private class Holder(val icon: ImageView, val name: TextView, val state: TextView)

              override val pageTitle: String
                  get() = "Aplikasi yang Ditampilkan"

              override val pageHint: String
                  get() = "OK: ganti Tampil, Di atas (favorit), atau Disembunyikan     Back: selesai"

              private var items: List<Item> = emptyList()
              private val adapter = ItemAdapter()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val apps = AppLoader.loadAll(this)
                  items = listOf(Item(null, 1), Item(null, 2)) + apps.map { Item(it, 0) }

                  listView.adapter = adapter
                  listView.setOnItemClickListener { _, _, position, _ ->
                      onItemClick(items[position])
                  }
                  listView.requestFocus()
              }

              private fun onItemClick(item: Item) {
                  val app = item.app
                  if (app != null) {
                      prefs.setAppState(app.pkg, (prefs.appState(app.pkg) + 1) % 3)
                  } else if (item.action == 1) {
                      prefs.showAll()
                  } else if (item.action == 2) {
                      prefs.hideAll(items.mapNotNull { it.app?.pkg })
                  }
                  adapter.notifyDataSetChanged()
              }

              private inner class ItemAdapter : BaseAdapter() {
                  override fun getCount(): Int = items.size

                  override fun getItem(position: Int): Any = items[position]

                  override fun getItemId(position: Int): Long = position.toLong()

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                      val holder: Holder
                      val view: View
                      if (convertView == null) {
                          val container = LinearLayout(this@ManageAppsActivity)
                          container.orientation = LinearLayout.HORIZONTAL
                          container.gravity = Gravity.CENTER_VERTICAL
                          container.setPadding(look.dp(24), look.dp(10), look.dp(24), look.dp(10))

                          val icon = ImageView(this@ManageAppsActivity)
                          val iconSize = look.dp(40)
                          val iconParams = LinearLayout.LayoutParams(iconSize, iconSize)
                          iconParams.rightMargin = look.dp(16)
                          container.addView(icon, iconParams)

                          val name = TextView(this@ManageAppsActivity)
                          name.textSize = 20f
                          container.addView(
