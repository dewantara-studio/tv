      - name: Build APK
        run: gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: RinganLauncher-apk
          path: app/build/outputs/apk/*/*.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ringan Launcher build ${{ github.run_number }}
          body: "Pasang app-release.apk di TV. Jika gagal dipasang, pakai app-debug.apk."
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
